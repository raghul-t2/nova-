<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Cart — Nova Stitch</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .cart-page { padding: 120px 5% 5rem; min-height: 100vh; }
    .cart-title { font-size: clamp(2.5rem,6vw,4.5rem); margin-bottom: 0.5rem; }
    .cart-subtitle { color: var(--gray); font-size:0.9rem; margin-bottom: 2.5rem; }
    .cart-layout { display: grid; grid-template-columns: 1fr 340px; gap: 2rem; }
    .cart-item {
      display: flex; align-items: center; gap: 1.2rem;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.2rem;
      margin-bottom: 1rem; transition: border-color var(--transition);
    }
    .cart-item:hover { border-color: var(--gold); }
    .cart-item-icon { font-size: 2.5rem; width: 60px; text-align:center; }
    .cart-item-info { flex: 1; }
    .cart-item-name { font-weight: 600; font-size: 0.95rem; }
    .cart-item-price { color: var(--gold); font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; margin-top: 0.2rem; }
    .cart-item-remove {
      background: none; border: 1px solid var(--border);
      color: var(--gray); padding: 0.4rem 0.8rem;
      border-radius: 6px; cursor: pointer; font-size: 0.75rem;
      transition: all var(--transition);
    }
    .cart-item-remove:hover { border-color: var(--red); color: var(--red); }
    .order-summary {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 1.8rem;
      height: fit-content; position: sticky; top: 90px;
    }
    .summary-title { font-size: 1.5rem; margin-bottom: 1.5rem; }
    .summary-row {
      display: flex; justify-content: space-between;
      padding: 0.7rem 0; border-bottom: 1px solid var(--border);
      font-size: 0.88rem; color: var(--gray);
    }
    .summary-row.total {
      border-bottom: none; color: var(--white);
      font-weight: 700; font-size: 1rem; padding-top: 1rem;
    }
    .summary-row span:last-child { color: var(--white); }
    .summary-row.total span:last-child { color: var(--gold); font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; }
    .coupon-row { display: flex; gap: 0.5rem; margin: 1rem 0; }
    .coupon-row input { flex: 1; }
    .coupon-row button { flex-shrink: 0; }
    .empty-cart { text-align: center; padding: 5rem 2rem; }
    .empty-cart .icon { font-size: 5rem; margin-bottom: 1rem; }
    .empty-cart h2 { font-size: 2.5rem; margin-bottom: 0.5rem; }
    .empty-cart p { color: var(--gray); margin-bottom: 2rem; }
    @media(max-width:768px) { .cart-layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-logo">NOVA <span>STITCH</span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="shop.html">Shop</a></li>
    </ul>
    <div class="nav-actions">
      <div class="cart-icon">🛒 <span class="cart-badge">0</span></div>
    </div>
  </nav>

  <div class="cart-page">
    <h1 class="cart-title">MY CART</h1>
    <p class="cart-subtitle" id="cart-count-label">Loading...</p>

    <div id="cart-empty" class="empty-cart" style="display:none">
      <div class="icon">🛒</div>
      <h2>YOUR CART IS EMPTY</h2>
      <p>Add some fire products to your cart first!</p>
      <a href="shop.html" class="btn-primary">Shop Now →</a>
    </div>

    <div class="cart-layout" id="cart-layout">
      <div>
        <div id="cart-items"></div>
      </div>
      <div class="order-summary">
        <h2 class="summary-title">ORDER SUMMARY</h2>
        <div class="summary-row"><span>Subtotal</span><span id="subtotal">₹0</span></div>
        <div class="summary-row"><span>Shipping</span><span id="shipping">₹99</span></div>
        <div class="summary-row"><span>Discount</span><span id="discount" style="color:var(--green)">-₹0</span></div>
        <div class="coupon-row">
          <input type="text" class="form-input" id="coupon-input" placeholder="Coupon code" />
          <button class="btn-primary" onclick="applyCoupon()" style="padding:0.5rem 1rem;font-size:0.8rem">Apply</button>
        </div>
        <div class="summary-row total"><span>Total</span><span id="total">₹0</span></div>
        <button class="btn-primary btn-full" style="margin-top:1rem" onclick="checkout()">CHECKOUT →</button>
        <a href="shop.html" style="display:block;text-align:center;color:var(--gray);font-size:0.82rem;margin-top:1rem;text-decoration:none">← Continue Shopping</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script>
    let discount = 0;

    function renderCart() {
      const items = JSON.parse(localStorage.getItem('ns_cart') || '[]');
      const container = document.getElementById('cart-items');
      const label = document.getElementById('cart-count-label');

      if (items.length === 0) {
        document.getElementById('cart-layout').style.display = 'none';
        document.getElementById('cart-empty').style.display = 'block';
        label.textContent = '0 items in your cart';
        return;
      }

      label.textContent = `${items.length} item${items.length > 1 ? 's' : ''} in your cart`;
      container.innerHTML = items.map((item, i) => `
        <div class="cart-item">
          <div class="cart-item-icon">${item.emoji}</div>
          <div class="cart-item-info">
            <div class="cart-item-name">${item.name}</div>
            <div class="cart-item-price">${item.price}</div>
          </div>
          <button class="cart-item-remove" onclick="removeItem(${i})">Remove</button>
        </div>
      `).join('');

      updateSummary(items);
    }

    function removeItem(index) {
      const items = JSON.parse(localStorage.getItem('ns_cart') || '[]');
      items.splice(index, 1);
      localStorage.setItem('ns_cart', JSON.stringify(items));
      renderCart();
      updateCartBadge();
    }

    function updateSummary(items) {
      const subtotal = items.reduce((sum, item) => {
        return sum + parseInt(item.price.replace(/[^0-9]/g, ''));
      }, 0);
      const shipping = subtotal >= 999 ? 0 : 99;
      const total = subtotal + shipping - discount;

      document.getElementById('subtotal').textContent = `₹${subtotal}`;
      document.getElementById('shipping').textContent = shipping === 0 ? 'FREE' : `₹${shipping}`;
      document.getElementById('discount').textContent = `-₹${discount}`;
      document.getElementById('total').textContent = `₹${total}`;
    }

    function applyCoupon() {
      const code = document.getElementById('coupon-input').value.trim().toUpperCase();
      const items = JSON.parse(localStorage.getItem('ns_cart') || '[]');
      const subtotal = items.reduce((sum, i) => sum + parseInt(i.price.replace(/[^0-9]/g, '')), 0);

      if (code === 'NOVASTITCH20') {
        discount = Math.round(subtotal * 0.2);
        showToast('🎉 Coupon applied! 20% off!');
        updateSummary(items);
      } else {
        showToast('❌ Invalid coupon code');
      }
    }

    function checkout() {
      const user = getCurrentUser();
      if (!user) {
        showToast('Please login to checkout!');
        setTimeout(() => window.location.href = 'login.html', 1500);
        return;
      }
      showToast('🎉 Order placed successfully!');
      localStorage.removeItem('ns_cart');
      setTimeout(() => window.location.href = 'index.html', 2000);
    }

    renderCart();
  </script>
</body>
</html>
